<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 아파트 시세 지도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <!-- 풀스크린 지도 -->
  <div id="map"></div>

  <!-- 플로팅 상단 컨트롤 (호갱노노 스타일) -->
  <header class="float-bar">
    <div class="brand-chip"><span class="logo">🏙️</span><b>서울아파트</b></div>
    <button id="btn-dashboard" class="chip-btn nav-link">📊 대시보드</button>
    <div class="search-box">
      <span class="s-icon">🔍</span>
      <input id="search-input" type="search" placeholder="단지명 검색" autocomplete="off">
    </div>
    <select id="district-select" class="chip-select" title="자치구 선택">
      <option value="">전체 서울</option>
    </select>
    <select id="deal-type" class="chip-select" title="거래 유형">
      <option value="sale">매매</option>
      <option value="jeonse">전세</option>
    </select>
    <select id="area-filter" class="chip-select" title="평형(전용면적) 필터">
      <option value="">전체 평형</option>
      <option value="~60㎡">~60㎡</option>
      <option value="60~85㎡">60~85㎡</option>
      <option value="85~135㎡">85~135㎡</option>
      <option value="135㎡~">135㎡~</option>
    </select>
    <button id="btn-filter" class="chip-btn">필터 <span id="filter-count" class="count hidden">0</span> ▾</button>
    <button id="btn-favorites" class="chip-btn">★ 관심단지 <span id="fav-count" class="count">0</span></button>
    <a class="chip-btn nav-link nav-right" href="devlog.html">📝 개발일지</a>
  </header>

  <!-- 대시보드 분할 패널 -->
  <aside id="dash-panel" class="dash-panel hidden">
    <div class="dash-head">
      <h1>📊 대시보드</h1>
      <button id="dash-close" class="dash-close" title="닫기">✕</button>
    </div>
    <section class="page-section">
      <h2>부동산원 가격지수 (서울)</h2>
      <div class="desc">한국부동산원 월간 아파트 매매·전세 가격지수</div>
      <div class="chart-tall"><canvas id="reb-chart"></canvas></div>
    </section>
    <section class="page-section">
      <h2>구별 평단가 랭킹</h2>
      <div class="desc" id="rank-desc">만원/평</div>
      <div class="table-scroll" id="rank-table-wrap"></div>
    </section>
    <section class="page-section">
      <h2>구별 평단가 추이</h2>
      <div class="desc">월별 매매 평단가(만원/평) · 칩을 눌러 구 토글</div>
      <div class="chip-row" id="trend-chips"></div>
      <div class="chart-tall"><canvas id="trend-chart"></canvas></div>
    </section>
    <section class="page-section">
      <h2>신축 → 구축 단지</h2>
      <div class="desc">준공연도 내림차순 · 구 선택</div>
      <select id="no-district" class="chip-select" style="margin-bottom:10px"></select>
      <div class="table-scroll" id="no-table-wrap"></div>
    </section>
    <section class="page-section">
      <h2>지역별 신고가 비중 <span id="ps-days" style="font-weight:400;font-size:12px;color:var(--muted)"></span></h2>
      <div class="desc">최근 거래 중 역대 최고가 갱신 비율 — 높을수록 최근 상승세</div>
      <div class="chart-tall" style="height:560px"><canvas id="peak-chart"></canvas></div>
    </section>
  </aside>
  <div id="dash-resizer" class="dash-resizer hidden" title="드래그해서 너비 조절"></div>

  <!-- 필터 패널 -->
  <div id="filter-panel" class="filter-panel hidden">
    <div class="fp-grid">
      <div class="fp-item fp-wide">
        <label>가격대(억) — 현재 매매/전세 기준</label>
        <div class="fp-range">
          <input id="f-min" type="number" min="0" step="0.5" placeholder="최소">
          <span>~</span>
          <input id="f-max" type="number" min="0" step="0.5" placeholder="최대">
        </div>
      </div>
      <div class="fp-item">
        <label>전세가율</label>
        <select id="f-jr">
          <option value="">전체</option>
          <option value="50">50% 이상</option>
          <option value="60">60% 이상</option>
          <option value="70">70% 이상</option>
          <option value="80">80% 이상</option>
        </select>
      </div>
      <div class="fp-item">
        <label>고점대비</label>
        <select id="f-drop">
          <option value="">전체</option>
          <option value="10">-10% 이하</option>
          <option value="20">-20% 이하</option>
          <option value="30">-30% 이하</option>
        </select>
      </div>
      <div class="fp-item">
        <label>준공연차</label>
        <select id="f-age">
          <option value="">전체</option>
          <option value="new5">신축(5년 이내)</option>
          <option value="new10">10년 이내</option>
          <option value="mid">10~30년</option>
          <option value="old30">30년 이상(재건축)</option>
        </select>
      </div>
      <div class="fp-item">
        <label>세대수</label>
        <select id="f-hh">
          <option value="">전체</option>
          <option value="300">300세대 이상</option>
          <option value="500">500세대 이상</option>
          <option value="1000">1,000세대 이상</option>
        </select>
      </div>
      <div class="fp-item">
        <label>용적률</label>
        <select id="f-far">
          <option value="">전체</option>
          <option value="150">150% 이하</option>
          <option value="200">200% 이하</option>
          <option value="250">250% 이하</option>
        </select>
      </div>
      <div class="fp-item">
        <label>거래 활발도(1년)</label>
        <select id="f-n1y">
          <option value="">전체</option>
          <option value="5">5건 이상</option>
          <option value="10">10건 이상</option>
          <option value="30">30건 이상</option>
        </select>
      </div>
      <div class="fp-item fp-check">
        <label><input id="f-peak" type="checkbox"> 신고가 단지만</label>
      </div>
    </div>
    <div class="fp-actions">
      <button id="f-reset" class="ghost">초기화</button>
      <button id="f-close" class="filled">닫기</button>
    </div>
  </div>

  <div class="updated" id="updated-label">데이터 기준일: —</div>

  <!-- 단지 상세 패널 -->
  <aside id="panel" class="panel hidden">
    <button class="panel-close" id="panel-close">✕</button>
    <div id="panel-content"></div>
  </aside>

  <div id="map-notice" class="map-notice hidden"></div>

  <!-- 랭킹/관심단지 모달 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- 카카오 JS 키 주입 (export 시 생성) -->
  <script src="js/config.js"></script>
  <!-- 차트 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/charts.js?v=4"></script>
  <script src="js/dashboard.js?v=7"></script>
  <script src="js/app.js?v=15"></script>
</body>
</html>
