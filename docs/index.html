<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 아파트 시세 지도</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏙️</span>
      <h1>서울 아파트 시세 지도</h1>
    </div>
    <div class="topbar-controls">
      <select id="district-select" title="자치구 선택">
        <option value="">전체 서울</option>
      </select>
      <input id="search-input" type="search" placeholder="단지명 검색" autocomplete="off">
      <select id="area-filter" title="평형(전용면적) 필터">
        <option value="">전체 평형</option>
        <option value="~60㎡">~60㎡</option>
        <option value="60~85㎡">60~85㎡</option>
        <option value="85~135㎡">85~135㎡</option>
        <option value="135㎡~">135㎡~</option>
      </select>
      <button id="btn-rankings" class="ghost">구별 랭킹</button>
      <button id="btn-favorites" class="ghost">관심단지 <span id="fav-count">0</span></button>
    </div>
    <div class="updated" id="updated-label">데이터 기준일: —</div>
  </header>

  <main class="layout">
    <div id="map"></div>

    <aside id="panel" class="panel hidden">
      <button class="panel-close" id="panel-close">✕</button>
      <div id="panel-content"></div>
    </aside>

    <div id="map-notice" class="map-notice hidden"></div>
  </main>

  <!-- 랭킹 모달 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- 카카오 JS 키 주입 (export 시 생성) -->
  <script src="js/config.js"></script>
  <!-- 차트 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
