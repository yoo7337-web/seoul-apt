name: Seoul Apt Daily Update

on:
  schedule:
    - cron: '0 0 * * *'        # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (collect | backfill)'
        default: 'collect'
        type: choice
        options: [collect, backfill]
      from_ym:
        description: '백필 시작 YYYYMM (backfill 모드에서만)'
        default: ''

permissions:
  contents: write

concurrency:
  group: seoul-apt-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # 6h 무한 대기 방지 - 문제 시 빠르게 실패해 알림
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r seoul_apt/requirements.txt

      - name: Restore DB from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/db_release.sh pull

      # data.go.kr 는 러너(해외 IP) 접속을 차단하는 경우가 있다(2026-08-05~06
      # 이틀 연속 전 요청 connect timeout → 재시도 지연 누적으로 60분 취소).
      # 불통이면 의존 단계(실거래·공시·청약·건축물대장)만 건너뛰고 나머지
      # (지수·export·알림·push)는 계속 진행 - 데이터는 로컬 수집으로 보충.
      - name: Check data.go.kr reachability
        id: apicheck
        run: |
          if curl -s -o /dev/null --connect-timeout 10 --max-time 20 "https://apis.data.go.kr/"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apis.data.go.kr 접속 불가(러너 IP 차단 추정) - 실거래·청약 수집 건너뜀"
          fi

      # 핵심 데이터(실거래·지수·청약) - 빠르게 끝남. 이게 export/commit 되어야 함.
      - name: Collect core data
        if: steps.apicheck.outputs.ok == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'collect' }}"
          if [ "$MODE" = "backfill" ]; then
            if [ -n "${{ github.event.inputs.from_ym }}" ]; then
              python -m seoul_apt.cli backfill --from "${{ github.event.inputs.from_ym }}"
            else
              python -m seoul_apt.cli backfill
            fi
          else
            python -m seoul_apt.cli collect
          fi
          python -m seoul_apt.cli gongsi
          python -m seoul_apt.cli subscription || echo "청약 수집 실패(계속 진행)"

      # data.go.kr 무관 수집(카카오·부동산원)은 불통이어도 항상 실행
      - name: Collect non-data.go.kr data
        env:
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python -m seoul_apt.cli geocode
          python -m seoul_apt.cli poi
          python -m seoul_apt.cli reb

      # 건축물대장은 남은 단지가 수천 개라 느림 → 별도 스텝 + 20분 하드 타임아웃
      # + continue-on-error. 20분 안에 처리한 만큼만 DB에 남고(부분진척 보존),
      # 실패/타임아웃해도 아래 export/commit 은 그대로 진행돼 실거래가 유실 안 됨.
      # 매 실행 800개씩 → 며칠에 걸쳐 backlog(약 6천개) 소진.
      - name: Building info (best-effort batch)
        if: steps.apicheck.outputs.ok == 'true'
        timeout-minutes: 20
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python -m seoul_apt.cli building --limit 800

      - name: Export JSON
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: python -m seoul_apt.cli export

      - name: Sanity check
        run: |
          test -f docs/data/meta.json || { echo "meta.json 없음"; exit 1; }

      - name: Save DB to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/db_release.sh push

      - name: Send alerts & digest (Telegram)
        if: ${{ (github.event.inputs.mode || 'collect') == 'collect' }}
        continue-on-error: true    # 알림 실패가 데이터 갱신을 막지 않게
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m seoul_apt.cli alerts

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data docs/js/config.js
          git diff --staged --quiet || git commit -m "data: 자동 갱신 $(date -u +%F)"
          git push
